# Builds the Fire TV app on every push to main and publishes it as the latest release,
# so the stick can download it from a fixed address:
#   https://github.com/steelesean/hearth-tv/releases/latest/download/hearth-tv.apk
name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HEARTH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hearth.jks"
            echo "HEARTH_KEYSTORE=$RUNNER_TEMP/hearth.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret, so this build uses a throwaway debug key. Updates won't install over it."
          fi

      - name: Build
        env:
          HEARTH_KEYSTORE_PASSWORD: ${{ secrets.HEARTH_KEYSTORE_PASSWORD }}
          HEARTH_VERSION_CODE: ${{ github.run_number }}
          HEARTH_VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk hearth-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-tv
          path: hearth-tv.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Hearth 0.1.${{ github.run_number }}
          files: hearth-tv.apk
          make_latest: true
